name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== Files in current directory ==="
        ls -la
        echo "=== package.json content ==="
        cat package.json
        echo "=== Running npm install ==="
        npm install --verbose 2>&1 || echo "npm install failed with exit code $?"
        echo "=== Checking node_modules ==="
        ls -la node_modules/ 2>&1 || echo "node_modules not found"

    - name: Verify Capacitor installation
      run: |
        echo "=== Checking node_modules/.bin ==="
        ls -la node_modules/.bin/ 2>&1 || echo "node_modules/.bin not found"
        echo "=== Looking for cap/capacitor ==="
        ls -la node_modules/.bin/ | grep -E "(cap|capacitor)" || echo "cap/capacitor not found in node_modules/.bin"

    - name: Add Android platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Android
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
