version: 2.4

jobs:
  build:
    docker:
      - image: cimg/node:20.10
      - image: cimg/android:2024.01.1

    working_directory: ~/repo

    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PATH: $JAVA_HOME/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/opt/android-sdk/tools/bin:$PATH

    steps:
      - checkout
        fetch-depth: 1

      - run:
          name: Clear npm config
          command: npm config delete registry || true; npm config delete proxy || true; npm config delete https-proxy || true

      - run:
          name: Install dependencies
          command: npm install --registry=https://registry.npmjs.org --no-optional --no-audit --verbose

      - run:
          name: Add Android platform
          command: npx --yes @capacitor/cli@5.5.0 add android

      - run:
          name: Sync Capacitor
          command: npx --yes @capacitor/cli@5.5.0 sync android

      - run:
          name: Build Android
          command: |
            cd android
            ./gradlew assembleDebug

      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: app-debug.apk
